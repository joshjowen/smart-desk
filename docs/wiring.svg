<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Desk controller wiring: two optos press the handset buttons; the desk box still drives the motor</text>
  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M109 120V200"/><path d="M194 92H280"/><path d="M460 84H560"/><path d="M460 104H560"/>
    <path d="M109 272V400"/><path d="M109 300H280"/><path d="M109 330H280"/><path d="M109 360H280"/>
    <path d="M460 300H560"/><path d="M460 330H560"/><path d="M460 360H560"/>
    <path d="M460 434H560"/><path d="M460 454H560"/><path d="M460 474H560"/><path d="M460 494H560"/>
  </g>
  <g fill="#8c959f"><circle cx="109" cy="300" r="3.5"/><circle cx="109" cy="330" r="3.5"/><circle cx="109" cy="360" r="3.5"/></g>
  <g font-size="11.5" fill="#59636e">
    <text x="237" y="84" text-anchor="middle">29 V</text>
    <text x="117" y="164">29 V, Y-split</text>
    <text x="101" y="336" text-anchor="end">4-pin cable</text>
    <text x="195" y="294" text-anchor="middle">UP line</text>
    <text x="195" y="324" text-anchor="middle">DOWN line</text>
    <text x="195" y="354" text-anchor="middle">desk GND</text>
    <text x="510" y="78" text-anchor="middle">5 V</text>
    <text x="510" y="118" text-anchor="middle">GND</text>
  </g>
  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <rect x="24" y="64" width="170" height="56" rx="8"/>
    <rect x="280" y="64" width="180" height="56" rx="8"/>
    <rect x="24" y="200" width="170" height="72" rx="8"/>
    <rect x="24" y="400" width="170" height="56" rx="8"/>
    <rect x="280" y="410" width="180" height="100" rx="8"/>
    <rect x="560" y="64" width="176" height="446" rx="8"/>
  </g>
  <rect x="280" y="250" width="180" height="130" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <g fill="#1f2328" text-anchor="middle">
    <text x="109" y="88" font-weight="600">29 V supply</text>
    <text x="370" y="88" font-weight="600">Buck 29 V to 5 V</text>
    <text x="109" y="230" font-weight="600">Desk control box</text>
    <text x="109" y="424" font-weight="600">Original handset</text>
    <text x="370" y="274" font-weight="600">PC817 2-ch module</text>
    <text x="648" y="180" font-weight="600">ESP32-C6</text>
  </g>
  <g fill="#59636e" font-size="11.5" text-anchor="middle">
    <text x="109" y="106">GRP-30W, 1 A</text>
    <text x="370" y="106">rated 36 V input or more</text>
    <text x="109" y="248">drives the motor</text>
    <text x="109" y="442">UP, GND, NC, DOWN</text>
    <text x="648" y="198">Waveshare 1.47in touch</text>
  </g>
  <text x="296" y="438" font-weight="600" fill="#1f2328">VL53L0X</text>
  <text x="296" y="456" font-size="11.5" fill="#59636e">top of leg column</text>
  <g font-size="11.5" fill="#1f2328">
    <text x="288" y="304">U1</text><text x="288" y="334">U2</text><text x="288" y="364">G</text>
    <text x="452" y="304" text-anchor="end">IN1</text><text x="452" y="334" text-anchor="end">IN2</text><text x="452" y="364" text-anchor="end">G</text>
    <text x="452" y="438" text-anchor="end">VIN</text><text x="452" y="458" text-anchor="end">GND</text>
    <text x="452" y="478" text-anchor="end">SDA</text><text x="452" y="498" text-anchor="end">SCL</text>
    <text x="568" y="88">5V</text><text x="568" y="108">GND</text>
    <text x="568" y="304">GPIO3 (UP)</text><text x="568" y="334">GPIO7 (DOWN)</text><text x="568" y="364">GND</text>
    <text x="568" y="438">3V3</text><text x="568" y="458">GND</text>
    <text x="568" y="478">GPIO18 SDA</text><text x="568" y="498">GPIO19 SCL</text>
  </g>
  <text x="24" y="540" font-size="11.5" fill="#59636e">Source mode shown, with a 10 kΩ pull-down on GPIO3 and GPIO7. In sink mode, module IN+ goes to 5 V and IN− to the GPIO.</text>
